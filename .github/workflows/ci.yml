name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test release-note tooling
        run: node --test tests/release-notes.test.mjs

      - name: Validate stored fragments
        run: node scripts/release-notes.mjs validate-fragments

      - name: Validate pull request release-note metadata
        if: github.event_name == 'pull_request'
        run: node scripts/release-notes.mjs validate-pr

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check formatting, modules, static analysis, and workflows
        run: make lint

  vulnerability-check:
    name: vulnerability-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Verify downloaded modules
        run: |
          go mod download
          go mod verify

      - name: Scan reachable dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  race:
    name: race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race ./...

  # ── Unit + smoke tests on natively-available runners ───────────
  # macos-13 (Intel) is intentionally omitted: GitHub's Intel macOS
  # runners are scarce and frequently fail to allocate (jobs queue for
  # hours and get cancelled). darwin/amd64 is covered by cross-build below.
  test:
    name: test (${{ matrix.runs-on }}, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            label: linux/amd64
            goos: linux
            goarch: amd64
          - runs-on: ubuntu-24.04-arm
            label: linux/arm64
            goos: linux
            goarch: arm64
          - runs-on: macos-latest
            label: darwin/arm64
            goos: darwin
            goarch: arm64
          - runs-on: windows-latest
            label: windows/amd64
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: go build -o /dev/null .

      - name: Run the portable release contract
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-contract"
          BINARY="${RUNNER_TEMP}/omnideck-contract"
          if [ "${EXPECTED_GOOS}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=ci-contract -X main.commit=${GITHUB_SHA} -X main.date=ci" \
            -o "${BINARY}" .
          go run ./tests/releasecontract \
            --binary "${BINARY}" \
            --mode portable \
            --expected-version ci-contract \
            --expected-os "${EXPECTED_GOOS}" \
            --expected-arch "${EXPECTED_GOARCH}" \
            --report "${RUNNER_TEMP}/release-contract/report.json" \
            --junit "${RUNNER_TEMP}/release-contract/junit.xml"

      - name: Upload portable contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-contract/
          if-no-files-found: warn

  # ── Compile checks for platforms without hosted native runners ──
  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null .
