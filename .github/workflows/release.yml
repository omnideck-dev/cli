name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Keep archive timestamps and tool output independent of the runner locale.
  TZ: UTC
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'signing-proof' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate semantic version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must be SemVer, for example v0.8.0-alpha.1 or v0.8.0"
            exit 1
          fi

      - name: Require a commit from main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Release tags must point to a commit already merged into main."
            exit 1
          fi

      - name: Require reviewed release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "${notes}" || {
            echo "Missing reviewed release notes: ${notes}"
            exit 1
          }
          remaining=$(find release-notes.d -maxdepth 1 -type f -name '*.md' ! -iname 'README.md' -print)
          test -z "${remaining}" || {
            echo "Release-note fragments must be incorporated before tagging:"
            echo "${remaining}"
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Verify release source
        run: make verify

  build:
    needs: verify
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-15' || 'ubuntu-24.04' }}
    environment: ${{ matrix.goos == 'darwin' && 'desktop-signing' || 'release-build' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Add Windows application metadata
        if: matrix.goos == 'windows'
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          go tool go-winres make \
            --arch "${TARGET_ARCH}" \
            --out rsrc \
            --file-version git-tag \
            --product-version git-tag

      - name: Build executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${RELEASE_VERSION}
          COMMIT=$(git rev-parse --short=12 HEAD)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          DATE=$(python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))' "${SOURCE_DATE_EPOCH}")
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist

          BIN=omnideck
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN=omnideck.exe
          fi

          # Keep Go build/symbol metadata for transparency and malware-analysis
          # tooling. -trimpath removes runner-specific filesystem paths.
          go build -trimpath -buildvcs=true -ldflags "${LDFLAGS}" -o "dist/${BIN}" .
          python3 -c 'import os,sys; t=int(sys.argv[2]); os.utime(sys.argv[1], (t,t))' "dist/${BIN}" "${SOURCE_DATE_EPOCH}"
          shasum -a 256 "dist/${BIN}"
          go version -m "dist/${BIN}"

      - name: Configure Developer ID signing
        if: matrix.goos == 'darwin'
        env:
          APPLE_TEAM_ID: 2FL6BUG8Q4
          DESKTOP_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.DESKTOP_MAC_CERTIFICATE_P12_BASE64 }}
          DESKTOP_MAC_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER_ID: ${{ secrets.DESKTOP_APPLE_API_ISSUER_ID }}
          DESKTOP_APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.DESKTOP_APPLE_API_PRIVATE_KEY_BASE64 }}
        run: scripts/macos/configure-signing.sh

      - name: Sign and notarize macOS CLI
        if: matrix.goos == 'darwin'
        env:
          APPLE_TEAM_ID: 2FL6BUG8Q4
        run: scripts/macos/sign-and-notarize.sh dist/omnideck

      - name: Preserve interrupted macOS executable
        if: failure() && matrix.goos == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-recovery-darwin-${{ matrix.goarch }}-${{ github.run_id }}
          path: dist/omnideck
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove signing material
        if: always() && matrix.goos == 'darwin'
        run: scripts/macos/cleanup-signing.sh

      - name: Generate executable SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/${{ matrix.goos == 'windows' && 'omnideck.exe' || 'omnideck' }}
          syft-version: v1.49.0
          format: spdx-json
          output-file: dist/omnideck-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest executable provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.goos == 'windows' && 'omnideck.exe' || 'omnideck' }}

      - name: Attest executable SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.goos == 'windows' && 'omnideck.exe' || 'omnideck' }}
          sbom-path: dist/omnideck-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json

      - name: Create archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          BIN=omnideck
          if [ "${GOOS}" = "windows" ]; then
            BIN=omnideck.exe
          fi

          ARCHIVE=omnideck-${GOOS}-${GOARCH}
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -X -q "${ARCHIVE}.zip" "${BIN}")
          elif [ "${GOOS}" = "darwin" ]; then
            python3 scripts/macos/package-cli.py "dist/${BIN}" "dist/${ARCHIVE}.tar.gz" "${SOURCE_DATE_EPOCH}"
          else
            chmod +x "dist/${BIN}"
            tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - -C dist "${BIN}" | gzip -n > "dist/${ARCHIVE}.tar.gz"
          fi

      - name: Validate final archive and target architecture
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          ARCHIVE="dist/omnideck-${EXPECTED_GOOS}-${EXPECTED_GOARCH}.tar.gz"
          if [ "${EXPECTED_GOOS}" = "windows" ]; then
            ARCHIVE="dist/omnideck-${EXPECTED_GOOS}-${EXPECTED_GOARCH}.zip"
          fi
          go run ./tests/releasecontract \
            --archive "${ARCHIVE}" \
            --mode artifact \
            --expected-os "${EXPECTED_GOOS}" \
            --expected-arch "${EXPECTED_GOARCH}" \
            --report "dist/contract-${EXPECTED_GOOS}-${EXPECTED_GOARCH}.json"

      - name: Upload artifact contract report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-artifact-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}
          path: dist/contract-${{ matrix.goos }}-${{ matrix.goarch }}.json
          if-no-files-found: warn

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnideck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/omnideck-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  portable-contract:
    needs: build
    name: portable-contract (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64
            archive: omnideck-linux-amd64.tar.gz
          - runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive: omnideck-linux-arm64.tar.gz
          - runs-on: macos-15
            goos: darwin
            goarch: arm64
            archive: omnideck-darwin-arm64.tar.gz
          - runs-on: macos-15-intel
            goos: darwin
            goarch: amd64
            archive: omnideck-darwin-amd64.tar.gz
          - runs-on: windows-latest
            goos: windows
            goarch: amd64
            archive: omnideck-windows-amd64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download packaged release target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnideck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-artifact

      - name: Verify packaged Developer ID and notarization
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p "${RUNNER_TEMP}/signed-cli"
          tar -xzf "release-artifact/${RELEASE_ARCHIVE}" -C "${RUNNER_TEMP}/signed-cli"
          codesign --verify --strict --check-notarization -R "=notarized" --verbose=4 "${RUNNER_TEMP}/signed-cli/omnideck"
          codesign --display --verbose=4 "${RUNNER_TEMP}/signed-cli/omnideck" 2>&1 | grep '^TeamIdentifier=2FL6BUG8Q4$'

      - name: Execute the packaged binary contract
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-contract"
          go run ./tests/releasecontract \
            --archive "release-artifact/${RELEASE_ARCHIVE}" \
            --mode portable \
            --expected-version "${RELEASE_VERSION}" \
            --expected-os "${EXPECTED_GOOS}" \
            --expected-arch "${EXPECTED_GOARCH}" \
            --report "${RUNNER_TEMP}/release-contract/report.json" \
            --junit "${RUNNER_TEMP}/release-contract/junit.xml"

      - name: Upload portable contract report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-contract/
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, portable-contract]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: omnideck-*

      - name: Create checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f -name 'omnideck-*' -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
